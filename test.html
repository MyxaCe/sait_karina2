<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Line - Тест функций</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        .test-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .test-item {
            padding: 15px;
            margin: 10px 0;
            border-left: 4px solid #6366f1;
            background: #f8fafc;
            border-radius: 5px;
        }
        .test-passed {
            border-left-color: #10b981;
            background: #ecfdf5;
        }
        .test-failed {
            border-left-color: #ef4444;
            background: #fef2f2;
        }
        .status {
            font-weight: bold;
            margin-right: 10px;
        }
        .passed { color: #10b981; }
        .failed { color: #ef4444; }
        .pending { color: #f59e0b; }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🧪 Тест Connect Line Website</h1>
        <p>Проверка всех компонентов и функций сайта Connect Line</p>
        
        <div id="test-results">
            <!-- Results will be populated by JavaScript -->
        </div>
        
        <button onclick="runTests()" style="background: #6366f1; color: white; padding: 12px 24px; border: none; border-radius: 6px; cursor: pointer; margin-top: 20px;">
            🔄 Запустить тесты
        </button>
    </div>

    <script>
        function runTests() {
            const resultsContainer = document.getElementById('test-results');
            resultsContainer.innerHTML = '';
            
            const tests = [
                {
                    name: 'Проверка загрузки основного сайта',
                    test: () => {
                        try {
                            // Попробуем загрузить главную страницу через fetch
                            return fetch('./index.html').then(response => response.ok);
                        } catch (e) {
                            return false;
                        }
                    }
                },
                {
                    name: 'Проверка загрузки CSS',
                    test: () => {
                        try {
                            return fetch('./css/style.css').then(response => response.ok);
                        } catch (e) {
                            return false;
                        }
                    }
                },
                {
                    name: 'Проверка загрузки JavaScript',
                    test: () => {
                        try {
                            return fetch('./js/main.js').then(response => response.ok);
                        } catch (e) {
                            return false;
                        }
                    }
                },
                {
                    name: 'Проверка логотипов',
                    test: () => {
                        try {
                            return Promise.all([
                                fetch('./images/logo.svg').then(r => r.ok),
                                fetch('./images/logo-white.svg').then(r => r.ok)
                            ]).then(results => results.every(r => r));
                        } catch (e) {
                            return false;
                        }
                    }
                },
                {
                    name: 'Проверка аватаров',
                    test: () => {
                        try {
                            return Promise.all([
                                fetch('./images/avatars/avatar1.svg').then(r => r.ok),
                                fetch('./images/avatars/avatar2.svg').then(r => r.ok),
                                fetch('./images/avatars/avatar3.svg').then(r => r.ok)
                            ]).then(results => results.every(r => r));
                        } catch (e) {
                            return false;
                        }
                    }
                }
            ];
            
            tests.forEach((test, index) => {
                const testItem = document.createElement('div');
                testItem.className = 'test-item';
                testItem.innerHTML = `
                    <span class="status pending">⏳</span>
                    <strong>${test.name}</strong>
                    <div style="margin-top: 5px; font-size: 14px; color: #666;">Выполняется...</div>
                `;
                resultsContainer.appendChild(testItem);
                
                // Запускаем тест
                Promise.resolve(test.test()).then(result => {
                    if (result) {
                        testItem.className = 'test-item test-passed';
                        testItem.innerHTML = `
                            <span class="status passed">✅</span>
                            <strong>${test.name}</strong>
                            <div style="margin-top: 5px; font-size: 14px; color: #059669;">Прошел успешно</div>
                        `;
                    } else {
                        testItem.className = 'test-item test-failed';
                        testItem.innerHTML = `
                            <span class="status failed">❌</span>
                            <strong>${test.name}</strong>
                            <div style="margin-top: 5px; font-size: 14px; color: #dc2626;">Тест не прошел</div>
                        `;
                    }
                }).catch(error => {
                    testItem.className = 'test-item test-failed';
                    testItem.innerHTML = `
                        <span class="status failed">❌</span>
                        <strong>${test.name}</strong>
                        <div style="margin-top: 5px; font-size: 14px; color: #dc2626;">Ошибка: ${error.message}</div>
                    `;
                });
            });
        }
        
        // Автоматически запускаем тесты при загрузке
        document.addEventListener('DOMContentLoaded', runTests);
    </script>
</body>
</html>
